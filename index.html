<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Green Decor | Decoração, Móveis, Flores e Interiores</title>
    <meta
      name="description"
      content="Projetos, mobiliário, floricultura, cortinas e curadoria para criar ambientes com identidade. Conheça a Green Decor e explore nosso catálogo."
    />
    <meta name="theme-color" content="#12372D" />
    <meta name="author" content="Green Decor · Grupo Green" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icone-192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- Canonical (ajustar ao domínio final) -->
    <!-- TODO: trocar pelo domínio real quando publicado -->
    <link rel="canonical" href="https://www.greendecor.com.br/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Green Decor" />
    <meta property="og:title" content="Green Decor | Decoração, Móveis, Flores e Interiores" />
    <meta
      property="og:description"
      content="Da flor ao mobiliário, transformamos espaços em experiências. Projetos, móveis, flores, cortinas e curadoria."
    />
    <meta property="og:url" content="https://www.greendecor.com.br/" />
    <meta property="og:image" content="./og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Green Decor | Decoração, Móveis, Flores e Interiores" />
    <meta
      name="twitter:description"
      content="Da flor ao mobiliário, transformamos espaços em experiências."
    />
    <meta name="twitter:image" content="./og.jpg" />

    <!-- Preload da imagem do hero (respeita as fontes responsivas) -->
    <link rel="preload" as="image" href="./fotos/hero-sala.jpg" media="(min-width: 768px)" fetchpriority="high" />
    <link rel="preload" as="image" href="./fotos/hero-showroom.jpg" media="(max-width: 767px)" fetchpriority="high" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Schema.org - usa apenas dados confirmados. Endereço, telefone, geo,
      avaliações e horários NÃO foram incluídos por não estarem confirmados
      nos arquivos da marca. Completar em src/data/site.ts e aqui quando reais.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HomeGoodsStore",
        "name": "Green Decor",
        "alternateName": "Green Flor & Decor",
        "description": "Decoração de interiores, mobiliário, floricultura, cortinas, persianas e curadoria de ambientes.",
        "parentOrganization": { "@type": "Organization", "name": "Grupo Green" },
        "areaServed": { "@type": "State", "name": "Santa Catarina" },
        "knowsAbout": ["Decoração de interiores", "Mobiliário", "Floricultura", "Cortinas e persianas", "Ambientação"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
